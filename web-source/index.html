<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f3">
  <meta name="description" content="Kim课表：查看每周课程、管理课程和备忘录、自定义学校作息，在本机读取文字版课表 PDF。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-32.png?v=9" type="image/png">
  <link rel="apple-touch-icon" href="./icon-180.png?v=9">
  <link rel="stylesheet" href="./style.css">
  <title>Kim课表 · 每一天，心里有数</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#week"><img class="brand-icon" src="./icon-192.png?v=9" alt="" width="37" height="37"><span>Kim课表<small>KIM TIMETABLE</small></span></a>
      <div class="side-caption">我的校园日常</div>
      <nav class="side-nav" aria-label="主要导航"></nav>
      <div class="side-bottom"><div class="school-mark">Kim<span id="sidebar-school">我的学校</span></div><p>把日子安排得刚刚好。</p><span class="demo-chip">DEMO · 演示版</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><a href="#week" class="mobile-brand"><img class="brand-icon" src="./icon-192.png?v=9" alt="" width="37" height="37">Kim课表</a><div class="desktop-breadcrumb">我的校园 <span>/</span> <strong id="breadcrumb">每周课表</strong></div><div class="topbar-right"><span class="school-badge" id="school-badge">我的学校</span><span class="avatar" aria-label="个人课表">课</span></div></header>
      <main id="main"></main>
      <footer class="page-footer"><span>Kim课表 · 手机演示版</span><span>课程信息以学校教务系统为准</span></footer>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="手机导航"></nav>
  <dialog id="sheet" class="sheet"><div id="sheet-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="file-input" type="file" accept="application/pdf,.pdf,application/json,.json" hidden>
  <script type="module" src="./app.js"></script>
</body>
</html>
